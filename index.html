<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="요카드(YOCARD)는 결제처와 금액에 맞춰 보유 카드와 멤버십 중 가장 유리한 혜택을 안내합니다.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://odilive.github.io/yocard/">
  <meta property="og:title" content="💳 요카드 YOCARD | 여기서는, 요 카드!">
  <meta property="og:description" content="구매처를 고르면 가장 유리한 카드와 멤버십 조합을 찾아드려요.">
  <title>💳 요카드 YOCARD | 여기서는, 요 카드!</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d1f2d'/%3E%3Crect x='13' y='17' width='38' height='30' rx='7' fill='%235be0b7'/%3E%3Cpath d='M22 33l6 6 14-16' fill='none' stroke='%230d1f2d' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✓</span>
      <span class="brand-copy">
        <span class="brand-name">요카드 <small>YOCARD</small></span>
        <span class="brand-tagline">여기서는, 요 카드!</span>
      </span>
    </div>
    <div class="header-actions">
      <span class="period" id="periodLabel"></span>
      <button class="button button-quiet" id="openStatus" type="button">내 카드 설정</button>
    </div>
  </header>

  <main id="top" class="shell">
    <section class="decision-panel" aria-labelledby="decisionTitle">
      <div class="section-kicker">할인카드 찾기</div>
      <h1 id="decisionTitle">어디서 결제하나요?</h1>
      <p class="lead">구매처를 고르면 가장 유리한 카드와 멤버십 조합을 찾아드려요.</p>

      <form id="recommendForm" class="recommend-form">
        <div class="field field-category">
          <label for="merchantCategory">카테고리</label>
          <div class="select-wrap">
            <select id="merchantCategory" required></select>
          </div>
        </div>

        <div class="field field-merchant">
          <label for="merchant">세부 브랜드</label>
          <div class="select-wrap">
            <select id="merchant"></select>
          </div>
        </div>

        <div class="field field-amount">
          <label for="amount">결제 예정 금액 <small>(선택)</small></label>
          <div class="money-input">
            <input id="amount" type="text" inputmode="numeric" autocomplete="off" aria-describedby="amountHelp">
            <span>원</span>
          </div>
          <div class="quick-amounts" id="amountHelp" aria-label="빠른 금액 입력">
            <button type="button" data-amount="unknown">미정</button>
            <button type="button" data-amount="5000">5천</button>
            <button type="button" data-amount="10000">1만</button>
            <button type="button" data-amount="30000">3만</button>
            <button type="button" data-amount="50000">5만</button>
          </div>
        </div>

        <button class="button button-primary submit-button" type="submit">
          <span>추천 결과 보기</span><span aria-hidden="true">→</span>
        </button>
      </form>
      <section class="favorites-panel" aria-labelledby="favoritesTitle">
        <div class="favorites-heading">
          <h2 id="favoritesTitle">즐겨찾기</h2>
        </div>
        <div class="favorites-list" id="favoritesList"></div>
      </section>
    </section>

    <section class="result-panel" aria-live="polite" aria-labelledby="resultTitle">
      <div class="result-heading">
        <div>
          <div class="section-kicker">추천 결과</div>
          <h2 id="resultTitle">어떻게 결제할까요?</h2>
        </div>
        <button class="favorite-toggle" id="toggleFavorite" type="button" aria-pressed="false"><span aria-hidden="true">☆</span><span>즐겨찾기</span></button>
      </div>
      <div id="results"></div>
    </section>

  </main>

  <dialog id="statusDialog" class="dialog">
    <form method="dialog" class="dialog-card" id="statusForm">
      <div class="dialog-head">
        <div>
          <h2>내 카드 설정</h2>
          <p>보유 카드와 전월 실적, T멤버십 정보를 관리합니다.</p>
        </div>
        <button class="close-button" value="cancel" aria-label="닫기" type="submit">×</button>
      </div>
      <section class="account-sync" id="accountSync" aria-labelledby="accountSyncTitle">
        <div class="account-sync-copy">
          <h3 id="accountSyncTitle">설정 동기화</h3>
          <p id="accountSyncDescription">로그인하면 다른 기기에서도 내 카드 설정을 불러올 수 있습니다.</p>
        </div>
        <div class="account-sync-signed-out" id="accountSyncSignedOut">
          <div class="account-sync-email">
            <input id="accountEmail" type="email" inputmode="email" autocomplete="email" aria-label="로그인할 이메일" placeholder="이메일 주소">
            <button id="sendLoginLink" type="button">로그인 링크 받기</button>
          </div>
        </div>
        <div class="account-sync-signed-in" id="accountSyncSignedIn" hidden>
          <div>
            <strong id="accountEmailLabel"></strong>
            <span id="accountSyncStatus">동기화 완료</span>
          </div>
          <button id="signOutAccount" type="button">로그아웃</button>
        </div>
      </section>
      <section class="card-picker" id="cardPicker" aria-label="카드 추가">
        <div class="card-picker-tools">
          <div class="card-search"><input id="cardSearch" type="search" autocomplete="off" aria-label="추가할 카드 검색" placeholder="추가할 카드명 · 카드사 · 혜택 검색"><button id="applyCardSearch" type="button">검색</button></div>
          <div class="card-picker-count" id="cardPickerCount" hidden></div>
        </div>
        <div class="card-picker-list" id="cardPickerList" hidden></div>
      </section>
      <div class="status-list" id="statusList"></div>
      <section class="profile-settings" aria-labelledby="profileSettingsTitle">
        <div class="profile-settings-head">
          <div>
            <h3 id="profileSettingsTitle">통신사 혜택 추가 <small>(선택)</small></h3>
            <p>통신사와 멤버십 정보를 입력하면 카드 혜택과 함께 비교합니다.</p>
          </div>
        </div>
        <div class="profile-grid">
          <label class="profile-field" for="carrier"><span>통신사</span><select id="carrier"><option value="skt">SKT</option><option value="none">통신사 혜택 사용 안 함</option></select></label>
          <label class="profile-field" for="membershipGrade"><span>멤버십 등급</span><select id="membershipGrade"><option value="silver">SILVER</option><option value="gold">GOLD</option><option value="vip">VIP</option><option value="none">사용 안 함</option></select></label>
        </div>
        <button class="profile-detail-button" id="openMembershipDetail" type="button">T멤버십 혜택 보기</button>
      </section>
      <div class="dialog-actions">
        <button class="button button-primary" id="saveStatus" value="default" type="submit">저장하고 다시 계산</button>
      </div>
    </form>
  </dialog>

  <dialog id="cardDialog" class="dialog card-detail-dialog">
    <div class="dialog-card">
      <div class="dialog-head">
        <div>
          <div class="section-kicker">등록된 혜택 원장</div>
          <h2 id="cardDetailTitle">카드 혜택 정보</h2>
          <p id="cardDetailMeta"></p>
        </div>
        <button class="close-button" id="closeCardDetail" aria-label="닫기" type="button">×</button>
      </div>
      <div id="cardDetailContent" class="card-detail-content"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./data/merchants.js"></script>
  <script src="./data/cards.js"></script>
  <script src="./data/membership.js"></script>
  <script src="./data/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./app.js"></script>
</body>
</html>
