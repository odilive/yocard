<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="요카드(YOCARD)는 결제처와 금액에 맞춰 보유 카드와 멤버십 중 가장 유리한 혜택을 안내합니다.">
  <title>요카드 | YOCARD — 오늘은, 요 카드.</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d1f2d'/%3E%3Crect x='13' y='17' width='38' height='30' rx='7' fill='%235be0b7'/%3E%3Cpath d='M22 33l6 6 14-16' fill='none' stroke='%230d1f2d' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="요카드 YOCARD 홈">
      <span class="brand-mark" aria-hidden="true">✓</span>
      <span>요카드 <small>YOCARD</small></span>
    </a>
    <div class="header-actions">
      <span class="period" id="periodLabel"></span>
      <button class="button button-quiet" id="openStatus" type="button">내 카드·설정</button>
    </div>
  </header>

  <main id="top" class="shell">
    <section class="decision-panel" aria-labelledby="decisionTitle">
      <div class="section-kicker">혜택 찾기</div>
      <h1 id="decisionTitle">어디서 결제하나요?</h1>
      <p class="lead">카테고리나 브랜드를 고르세요. 금액이 정해졌다면 받을 수 있는 혜택까지 계산해 드려요.</p>

      <form id="recommendForm" class="recommend-form">
        <div class="field field-merchant">
          <label for="merchant">구매처</label>
          <div class="select-wrap">
            <select id="merchant" required></select>
          </div>
        </div>

        <div class="field field-amount">
          <label for="amount">결제 예정 금액 <small>(선택)</small></label>
          <div class="money-input">
            <input id="amount" type="text" inputmode="numeric" autocomplete="off" aria-describedby="amountHelp">
            <span>원</span>
          </div>
          <div class="quick-amounts" id="amountHelp" aria-label="빠른 금액 입력">
            <button type="button" data-amount="unknown">미정</button>
            <button type="button" data-amount="5000">5천</button>
            <button type="button" data-amount="10000">1만</button>
            <button type="button" data-amount="30000">3만</button>
            <button type="button" data-amount="50000">5만</button>
          </div>
        </div>

        <button class="button button-primary submit-button" type="submit">
          <span>혜택 비교하기</span><span aria-hidden="true">→</span>
        </button>
      </form>
      <section class="favorites-panel" aria-labelledby="favoritesTitle">
        <div class="favorites-heading">
          <h2 id="favoritesTitle">즐겨찾기</h2>
          <span>누르면 금액 미정으로 바로 비교</span>
        </div>
        <div class="favorites-list" id="favoritesList"></div>
      </section>
    </section>

    <section class="result-panel" aria-live="polite" aria-labelledby="resultTitle">
      <div class="result-heading">
        <div>
          <div class="section-kicker">추천 결과</div>
          <h2 id="resultTitle">어떻게 결제할까요?</h2>
        </div>
        <button class="favorite-toggle" id="toggleFavorite" type="button" aria-pressed="false"><span aria-hidden="true">☆</span><span>즐겨찾기</span></button>
      </div>
      <div id="results"></div>
    </section>

  </main>

  <dialog id="statusDialog" class="dialog">
    <form method="dialog" class="dialog-card" id="statusForm">
      <div class="dialog-head">
        <div>
          <div class="section-kicker">보유 카드 + 개인 설정</div>
          <h2>내 카드·설정</h2>
          <p>카드 혜택을 확인하고, 추천에 사용할 조건과 전월 실적 구간을 관리합니다.</p>
        </div>
        <button class="close-button" value="cancel" aria-label="닫기" type="submit">×</button>
      </div>
      <section class="profile-settings" aria-labelledby="profileSettingsTitle">
        <h3 id="profileSettingsTitle">평소 설정</h3>
        <div class="profile-grid">
          <label class="profile-field" for="carrier"><span>내 통신사</span><select id="carrier"><option value="unset">미설정</option><option value="skt">SKT</option><option value="kt">KT</option><option value="lgu">LG U+</option><option value="liivm">Liiv M</option><option value="mvno">기타 알뜰폰</option><option value="none">통신요금 없음</option></select></label>
          <label class="profile-field" for="membershipGrade"><span>통신사 멤버십 등급</span><select id="membershipGrade"><option value="silver">SILVER</option><option value="gold" disabled>GOLD (미등록)</option><option value="vip" disabled>VIP (미등록)</option><option value="lite" disabled>LITE (미등록)</option><option value="none">사용 안 함</option></select></label>
          <label class="profile-field" for="membershipMode"><span>T멤버십 이용 방식</span><select id="membershipMode"><option value="discount">할인형</option><option value="point">적립형</option></select><small>현재 SKT SILVER 상시 혜택이 추천에 등록되어 있습니다.</small></label>
          <label class="profile-field" for="phoneAmount"><span>월 통신요금</span><select id="phoneAmount"><option value="unset">미설정</option><option value="under10000">1만원 미만</option><option value="10000">1만원 이상~5만원 미만</option><option value="50000">5만원 이상</option><option value="none">통신요금 없음</option></select></label>
        </div>
      </section>
      <div class="status-section-head"><h3>보유 카드</h3><span>카드 이름을 누르면 전체 혜택 확인</span></div>
      <div class="status-list" id="statusList"></div>
      <div class="dialog-actions">
        <button class="button button-danger" id="resetUsage" type="button">이번 달 기록 초기화</button>
        <button class="button button-primary" id="saveStatus" value="default" type="submit">저장하고 다시 계산</button>
      </div>
    </form>
  </dialog>

  <dialog id="cardDialog" class="dialog card-detail-dialog">
    <div class="dialog-card">
      <div class="dialog-head">
        <div>
          <div class="section-kicker">등록된 혜택 원장</div>
          <h2 id="cardDetailTitle">카드 혜택 정보</h2>
          <p id="cardDetailMeta"></p>
        </div>
        <button class="close-button" id="closeCardDetail" aria-label="닫기" type="button">×</button>
      </div>
      <div id="cardDetailContent" class="card-detail-content"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
