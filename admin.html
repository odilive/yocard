<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>요카드 — 카드 정보 관리</title>
  <link rel="stylesheet" href="./admin.css?v=20261111">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html"><span class="brand-icon">✓</span><span>요카드 <small>YOCARD</small></span></a>
    <span class="workspace-title">카드 정보 관리</span>
    <button id="connect" class="quiet" type="button">관리자 로그인</button>
  </header>
  <div class="mode-bar"><span class="mode-dot"></span><strong id="modeLabel">미리보기</strong><span id="modeDescription">로그인하면 DB에 저장된 카드 정보를 확인할 수 있어요.</span><span class="draft-only">사용자 서비스 반영 전</span></div>
  <main class="workspace">
    <aside class="sidebar">
      <div class="sidebar-title"><h1>카드 목록</h1><span id="cardCount"></span></div>
      <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="카드명·브랜드 검색" aria-label="카드명 또는 브랜드 검색"></label>
      <nav id="cards" aria-label="검수할 카드"></nav>
      <details class="backup-tools"><summary>백업 파일 관리</summary><div class="sidebar-footer"><button id="export" type="button">백업 내보내기 ↗</button><label class="file-button">백업 가져오기<input type="file" id="import" accept="application/json,.json"></label></div></details>
    </aside>
    <section class="main-panel" id="mainPanel" aria-live="polite">
      <p class="loading">카드 정보를 불러오고 있어요.</p>
    </section>
  </main>
  <dialog id="editor" class="editor-dialog">
    <form id="editForm">
      <div class="dialog-head"><div><span class="eyebrow">혜택 검수</span><h2 id="editorTitle">혜택 수정</h2></div><button type="button" class="close" data-close="editor" aria-label="닫기">×</button></div>
      <div class="dialog-body" id="editorBody"></div>
      <div class="dialog-footer"><span>변경사항 적용 후 상단의 ‘카드 저장’을 눌러주세요.</span><button type="button" class="quiet" data-close="editor">취소</button><button class="primary" type="submit">변경사항 적용</button></div>
    </form>
  </dialog>
  <dialog id="limitEditor" class="editor-dialog">
    <form id="limitForm"><div class="dialog-head"><div><span class="eyebrow">한도 관리</span><h2>한도 수정</h2></div><button type="button" class="close" data-close="limitEditor" aria-label="닫기">×</button></div><div class="dialog-body" id="limitEditorBody"></div><div class="dialog-footer"><span>변경사항 적용 후 상단의 ‘카드 저장’을 눌러주세요.</span><button type="button" class="quiet" data-close="limitEditor">취소</button><button class="primary" type="submit">변경사항 적용</button></div></form>
  </dialog>
  <dialog id="cardEditor" class="editor-dialog">
    <form id="metadataForm"><div class="dialog-head"><h2>카드 정보 수정</h2><button type="button" class="close" data-close="cardEditor" aria-label="닫기">×</button></div><div id="cardEditorBody" class="dialog-body"></div><div class="dialog-footer"><span>변경사항 적용 후 상단의 ‘카드 저장’을 눌러주세요.</span><button type="button" class="quiet" data-close="cardEditor">취소</button><button type="submit" class="primary">변경사항 적용</button></div></form>
  </dialog>
  <dialog id="connectionDialog" class="connection-dialog">
    <form id="loginForm"><div class="dialog-head"><h2>관리자 로그인</h2><button class="close" type="button" data-close="connectionDialog" aria-label="닫기">×</button></div><div class="dialog-body"><p>로그인하면 DB에 저장된 카드 정보를 검수·수정할 수 있어요.</p><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><p id="loginFeedback" role="status"></p></div><div class="dialog-footer"><button type="button" id="useLocal" class="quiet">미리보기로 돌아가기</button><button type="submit" class="primary">로그인</button></div></form>
  </dialog>
  <p id="feedback" class="toast" role="status" hidden></p>
  <script src="./catalog/model.js"></script>
  <script src="./catalog/presentation.js"></script>
  <script src="./data/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./admin.js?v=20261111"></script>
</body>
</html>
